<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYGNUS Automation | Home</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --text-color: #e2e8f0;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 4rem 0; /* Added padding for top/bottom spacing */
        }

        /* Tech Glow Background Effects */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: var(--accent-gradient);
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
        }

        body::before { top: 10%; left: 15%; }
        body::after { bottom: 10%; right: 15%; }

        .container {
            max-width: 900px;
            text-align: center;
            padding: 2rem;
            z-index: 1;
            margin-bottom: 2rem;
        }

        .logo-area {
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .links-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Changed to 2 columns to host the remaining two cards evenly */
            gap: 1.5rem;
            width: 100%;
            margin: 0 auto;
        }

        .nav-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            padding: 2rem 1.5rem;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        /* Tech border glow on hover */
        .nav-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent-gradient);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .nav-card:hover {
            transform: translateY(-5px);
            border-color: transparent;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .nav-card:hover::before {
            opacity: 0.15;
        }

        .nav-card h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-card:hover h3 {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-card p {
            font-size: 0.875rem;
            color: #64748b;
        }

        .status-tag {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.5rem;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            color: #64748b;
        }

        footer {
            margin-top: auto;
            padding-top: 2rem;
            color: #475569;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .links-container { grid-template-columns: 1fr; max-width: 400px; }
            .nav-card { min-height: 120px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area"></div>
        <h1>CYGNUS Automation</h1>
        <p class="subtitle">Automate tasks with us for free.</p>

        <div class="links-container">
            <a href="https://yjdcygnusautomationspptdocxecxlfile.netlify.app/" class="nav-card">
                <span class="status-tag">Ready to link</span>
                <h3>Automation Model</h3>
                <p>Doc, Sheet, & PPT automation</p>
            </a>

            <a href="https://yjdcygnusterminusautomation.netlify.app/" class="nav-card">
                <span class="status-tag">New</span>
                <h3>Cloud Automater</h3>
                <p>Access the core terminal ecosystem</p>
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Sagittarius Automation. All rights reserved.
    </footer>

</body>
</html>
